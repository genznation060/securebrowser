name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Create missing debug keystore
        run: |
          # The project references ${rootDir}/debug.keystore
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Create empty .env if missing
        run: |
          # Secrets Gradle Plugin needs .env or .env.example
          [ -f .env ] || touch .env
          [ -f .env.example ] || touch .env.example

      - name: Build Debug APK
        run: |
          # Generate wrapper with the version required by AGP 9.1.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: securebrowser-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: warn
